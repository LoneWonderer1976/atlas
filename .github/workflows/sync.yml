# Hourly: fetch new activities from Garmin, rebuild every number, publish the page. Commits only when something changed.
name: sync
on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07 (GitHub's schedule is best-effort, not exact)
  workflow_dispatch:
concurrency: { group: atlas-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: sync from Garmin
        env: { GARMINTOKENS: "${{ secrets.GARMINTOKENS }}" }
        run: python -m atlas.sync
      - name: score and build the page
        run: python -m atlas.stats --print
      - name: commit what changed
        run: |
          git config user.name "atlas"
          git config user.email "atlas@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing new" || git commit -m "sync $(date -u +'%Y-%m-%d %H:%M')" -q
          git push
